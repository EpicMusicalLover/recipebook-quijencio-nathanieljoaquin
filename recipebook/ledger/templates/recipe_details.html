{% extends "base.html" %}

{% block content %}
<h2>Recipe Details</h2>

<h2>{{ recipe.name }}</h2>
<p>Author: {{ recipe.author.name }}</p>

<ul>
    {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.quantity }} - {{ ingredient.ingredient.name }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
