{% extends "base.html" %}

{% block content %}
<h2> Recipe List </h2>

    <ul>
        {% for recipe in recipe_list %}
        <li>
            <a href="{{ recipe.get_absolute_url}}">{{recipe.name}}</a>
        </li>
        {% endfor %}
        {% if user.is_authenticated %}
        <a href="{% url 'recipe_add' %}">Add New Recipe</a>
        {% endif %}
    </ul>
{% endblock %}
